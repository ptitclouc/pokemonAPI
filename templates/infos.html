{{define "character"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - {{.Name.Fr}}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="shortcut icon" href="/static/images/jeu.png" type="image/x-icon">
</head>
<body>
    <a href="/pokemon">← Retour</a>

    <div class="detail">
        <p><strong>N°{{.Id}}</strong></p>
        <img class="sprite" src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}">
        <h1>{{.Name.Fr}}</h1>
        <p><em>{{.Category}}</em></p>

        <div class="types">
            {{range .Types}}
            <div class="type-badge">
                <img src="{{.Image}}" alt="{{.Name}}">
                <span>{{.Name}}</span>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
{{end}}

{{define "list"}}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <link rel="shortcut icon" href="/static/images/jeu.png" type="image/x-icon">
</head>
<body>
    <h1>Pokédex</h1>

    <form action="/pokemon">
        <input name="nom" value="{{.Search}}" placeholder="Rechercher un pokémon...">
        <button>Chercher</button>
    </form>

    <div class="grid">
        {{range .Characters}}
        <a class="card" href="/pokemon/{{.Id}}">
            <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}" loading="lazy">
            <p>N°{{.Id}}</p>
            <h2>{{.Name.Fr}}</h2>
        </a>
        {{else}}
        <p>Aucun résultat.</p>
        {{end}}
    </div>
</body>
</html>
{{end}}
